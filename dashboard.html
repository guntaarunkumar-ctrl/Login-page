<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>

  <!-- Mobile top bar -->
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-brand">
      <div class="brand-icon">✦</div>
      <span>Dashboard</span>
    </div>
  </header>

  <div class="layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">✦</div>
        <span class="sidebar-title">Project Hub</span>
      </div>

      <nav class="nav">

        <!-- Planning group -->
        <div class="nav-group" id="group-planning">
          <button
            class="nav-group-btn"
            aria-expanded="true"
            data-group="planning"
          >
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <span class="nav-label">Planning</span>
            <span class="chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="nav-children" id="children-planning">
            <button class="nav-item active" data-tab="Schedules">
              <span class="nav-dot"></span>Schedules
            </button>
            <button class="nav-item" data-tab="Planning Reports">
              <span class="nav-dot"></span>Planning Reports
            </button>
          </div>
        </div>

        <!-- QS & Billing group -->
        <div class="nav-group" id="group-qs">
          <button
            class="nav-group-btn"
            aria-expanded="false"
            data-group="qs"
          >
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
            </span>
            <span class="nav-label">QS &amp; Billing</span>
            <span class="chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="nav-children collapsed" id="children-qs">
            <button class="nav-item" data-tab="BOQs">
              <span class="nav-dot"></span>BOQs
            </button>
            <button class="nav-item" data-tab="NT Items">
              <span class="nav-dot"></span>NT Items
            </button>
            <button class="nav-item" data-tab="Billing">
              <span class="nav-dot"></span>Billing
            </button>
          </div>
        </div>

      </nav>

      <div class="sidebar-footer">
        <a href="index.html" class="btn-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main" id="main">
      <div class="content-area">
        <div class="coming-soon">
          <div class="cs-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <h2 class="cs-title" id="csTitle">Schedules</h2>
          <p class="cs-text">This section is coming soon.</p>
          <span class="cs-badge">In Development</span>
        </div>
      </div>
    </main>

  </div>

  <script src="dashboard.js"></script>
</body>
</html>
