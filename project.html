<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Hub</title>
  <link rel="stylesheet" href="project.css" />
</head>
<body>

  <!-- Mobile top bar -->
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Toggle sidebar">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-brand">
      <div class="brand-icon">✦</div>
      <span>Project Hub</span>
    </div>
    <div class="topbar-user">
      <div class="topbar-user-meta">
        <span class="topbar-user-name" id="topbarUserName">—</span>
        <span class="topbar-user-date" id="topbarUserDate">—</span>
      </div>
      <div class="user-avatar" id="topbarUserAvatar"></div>
    </div>
  </header>

  <div class="layout">

    <!-- Sidebar overlay (mobile) -->
    <div class="overlay" id="overlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand-icon">✦</div>
        <span class="sidebar-title">Project Hub</span>
      </div>

      <nav class="nav">

        <!-- Planning group -->
        <div class="nav-group" id="group-planning">
          <button class="nav-group-btn" aria-expanded="true" data-group="planning">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
              </svg>
            </span>
            <span class="nav-label">Planning</span>
            <span class="chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="nav-children" id="children-planning">
            <button class="nav-item active" data-tab="Schedules">
              <span class="nav-dot"></span>Schedules
            </button>
            <button class="nav-item" data-tab="Planning Reports">
              <span class="nav-dot"></span>Planning Reports
            </button>
          </div>
        </div>

        <!-- Tracking group -->
        <div class="nav-group" id="group-tracking">
          <button class="nav-group-btn" aria-expanded="false" data-group="tracking">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
                <path d="M13 13l6 6"/>
              </svg>
            </span>
            <span class="nav-label">Tracking</span>
            <span class="chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="nav-children collapsed" id="children-tracking">
            <button class="nav-item" data-tab="Pictorial">
              <span class="nav-dot"></span>Pictorial
            </button>
          </div>
        </div>

        <!-- QS & Billing group -->
        <div class="nav-group" id="group-qs">
          <button class="nav-group-btn" aria-expanded="false" data-group="qs">
            <span class="nav-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"/>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
              </svg>
            </span>
            <span class="nav-label">QS &amp; Billing</span>
            <span class="chevron">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </span>
          </button>
          <div class="nav-children collapsed" id="children-qs">
            <button class="nav-item" data-tab="BOQs">
              <span class="nav-dot"></span>BOQs
            </button>
            <button class="nav-item" data-tab="NT Items">
              <span class="nav-dot"></span>NT Items
            </button>
            <button class="nav-item" data-tab="Billing">
              <span class="nav-dot"></span>Billing
            </button>
          </div>
        </div>

      </nav>

      <div class="sidebar-footer">
        <button id="signOutBtn" class="btn-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main" id="main">

      <!-- Top header with user info -->
      <header class="main-header">
        <span class="main-header-title" id="pageTitle">Schedules</span>
        <div class="user-info">
          <div class="user-meta">
            <span class="user-name" id="userName">—</span>
            <span class="user-last-login" id="userLastLogin">—</span>
          </div>
          <div class="user-avatar" id="userAvatar"></div>
        </div>
      </header>

      <div class="content-area" id="contentArea">
        <div class="coming-soon" id="comingSoon">
          <div class="cs-icon">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polyline points="12 6 12 12 16 14"/>
            </svg>
          </div>
          <h2 class="cs-title" id="csTitle">Schedules</h2>
          <p class="cs-text">This section is coming soon.</p>
          <span class="cs-badge">In Development</span>
        </div>

        <!-- Pictorial progress view -->
        <div class="pictorial-view" id="pictorialView">

          <!-- Toolbar: hidden until an image is loaded -->
          <div class="pictorial-toolbar" id="pictorialToolbar" style="display:none">
            <div class="pictorial-brush-wrap">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                <path d="M2 2l7.586 7.586"/>
                <circle cx="11" cy="11" r="2"/>
              </svg>
              <span class="pictorial-brush-label">Brush</span>
              <input type="range" id="brushSize" class="pictorial-slider" min="10" max="70" value="30" />
            </div>
            <div class="pictorial-actions">
              <button id="changeImg" class="btn-change-img">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/>
                  <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Change
              </button>
              <button id="clearCanvas" class="btn-clear-canvas">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/>
                  <path d="M10 11v6"/><path d="M14 11v6"/>
                </svg>
                Clear
              </button>
            </div>
          </div>

          <!-- Upload drop-zone: shown until image is loaded -->
          <label class="pictorial-upload-area" id="uploadArea">
            <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
            <span class="upload-title">Upload Floor Plan</span>
            <span class="upload-sub">Tap to select an image &nbsp;·&nbsp; or drag &amp; drop</span>
            <input type="file" id="floorPlanInput" accept="image/*" />
          </label>

          <!-- Canvas view: hidden until image is loaded -->
          <div class="pictorial-wrap" id="pictorialWrap" style="display:none">
            <img id="floorPlanImg" alt="Floor Plan" draggable="false" />
            <canvas id="progressCanvas"></canvas>
          </div>

          <p class="pictorial-hint" id="pictorialHint" style="display:none">Swipe over any room or area to mark it as complete</p>
        </div>
      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="project.js"></script>
</body>
</html>
